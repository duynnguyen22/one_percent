name: Backend CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habit_tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habit_tracker?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habit_tracker_test?schema=public
      JWT_SECRET: ci-jwt-secret
      JWT_RESET_SECRET: ci-jwt-reset-secret
      JWT_EXPIRES_IN: 5D
      SMTP_HOST: localhost
      SMTP_PORT: '2525'
      SMTP_SECURE: 'false'
      SMTP_USER: ci
      SMTP_PASS: ci
      MAIL_FROM: 'Bloom <no-reply@bloom.app>'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Prisma validation
        run: pnpm prisma:emit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e
