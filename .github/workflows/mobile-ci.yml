name: Mobile CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check declared assets exist
        run: |
          missing=0
          for path in $(sed -n '/^  assets:/,/^  [a-z]/p' pubspec.yaml | grep -E '^[[:space:]]+- ' | sed -E 's/^[[:space:]]+- //; s/["'\'']//g'); do
            if [ ! -e "$path" ]; then
              echo "::error file=mobile/pubspec.yaml::Asset path not found: $path"
              missing=1
            fi
          done
          exit $missing

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build check
        run: flutter build apk --debug
